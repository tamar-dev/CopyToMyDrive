<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copy to My Drive</title><style>body{font:14px system-ui;width:320px;margin:0;padding:20px;color:#172033;background:#fff;box-sizing:border-box}header{display:flex;align-items:center;gap:10px;margin-bottom:20px}h1{font-size:18px;margin:0}p{line-height:1.5}button,input{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;font:inherit}button{background:#2563eb;color:white;border:0;cursor:pointer;margin-top:14px;font-weight:600}button:disabled{opacity:.6}input{border:1px solid #cbd5e1;margin-top:10px;direction:ltr}details{margin-top:14px;color:#475569}summary{cursor:pointer}#source{background:#f1f5f9;padding:12px;border-radius:8px}#status{overflow-wrap:anywhere}#status[data-phase=success]{color:#16803c}#status[data-phase=error]{color:#b42318}#result{color:#2563eb}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}</style></head><body><header><img src="icon.svg" width="36" height="36" alt=""><h1 data-i18n="appName"></h1></header><p id="source"></p><button id="copy" data-i18n="copy"></button><details id="manual"><summary data-i18n="other"></summary><label for="link" data-i18n="paste"></label><input id="link" type="url"></details><p id="status" role="status" aria-live="polite"></p><a id="result" hidden target="_blank" rel="noopener noreferrer" data-i18n="open"></a><script type="module" src="popup.js"></script></body></html>
